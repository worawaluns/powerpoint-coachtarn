<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>คิวถ่าย CoachTarn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b2130; --muted:#5d6475; --line:#dfe2e8;
  --accent:#d9412b; --accent-ink:#ffffff; --accent-soft:#fbe7e3;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --warn:#9a6a00; --warn-soft:#fff3d6;
  --m1:#2f5fd0; --m2:#8a3fc2; --m3:#0f8a8a; --m4:#c26a12;
  --sans:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --surface:#1b2029; --ink:#eceef3; --muted:#a2a9b8; --line:#2c3340;
    --accent:#ef5a43; --accent-soft:#3a1f1b; --ok:#46c28a; --ok-soft:#173026; --warn:#e2b340; --warn-soft:#342a12;
    --m1:#7ea2ff; --m2:#c38af0; --m3:#4fd0cf; --m4:#f0a456;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b2029; --ink:#eceef3; --muted:#a2a9b8; --line:#2c3340;
  --accent:#ef5a43; --accent-soft:#3a1f1b; --ok:#46c28a; --ok-soft:#173026; --warn:#e2b340; --warn-soft:#342a12;
  --m1:#7ea2ff; --m2:#c38af0; --m3:#4fd0cf; --m4:#f0a456;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(15px * var(--ui,1));line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 80px}
h2{font-size:19px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0 0 6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sticky top: title row + day progress + tabs */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 6px;display:grid;gap:8px}
.titlerow{display:flex;align-items:center;gap:10px}
.titlerow h1{font-size:18px;margin:0;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{font-family:var(--mono);font-size:13px;color:#fff;min-width:44px;text-align:center}
.themebtn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;display:grid;place-items:center}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
.day{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap}
.daybar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.daybar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.mode{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);padding:3px;border-radius:10px}
.mbtn{border:0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.mbtn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab .o{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tab .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tab.full .cnt{color:var(--ok)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .cnt,.tab[aria-selected="true"] .o{color:var(--bg);opacity:.75}

details.how{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:6px}
details.how summary{cursor:pointer;font-weight:600;font-size:14px}
details.how ol{margin:8px 0 4px;padding-left:20px}

/* location hero: the one thing to do next */
.hero{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.hero-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.chipline{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;background:var(--bg);border-radius:8px;padding:3px 9px}
.scene{font-size:14px;color:var(--muted);margin:0}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:12px;padding:14px 16px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:700;cursor:pointer}
.go small{font-weight:500;font-size:13px;opacity:.9}
.go.ok{background:var(--ok)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}

.list{display:grid;gap:10px;margin-top:12px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr auto;align-items:stretch;overflow:hidden}
.clip-main{border:0;background:none;text-align:left;padding:12px 14px;cursor:pointer;display:grid;gap:6px;min-width:0}
.clip-main:hover{background:var(--bg)}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--mono);font-weight:600;font-size:14px;min-width:34px;text-align:center;border:1.5px solid var(--ink);border-radius:8px;padding:0 6px}
.chip{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.M1{color:var(--m1)} .chip.M2{color:var(--m2)} .chip.M3{color:var(--m3)} .chip.M4{color:var(--m4)}
.chip.pri{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.flag{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.skip{color:var(--muted);background:var(--bg);border-color:transparent}
.line{display:grid;grid-template-columns:50px 1fr;gap:8px;align-items:baseline}
.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.tc{white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--muted);display:block;font-weight:500}
.say{font-size:calc(16px * var(--ui,1));font-weight:500}
.note{font-size:13px;color:var(--warn)}
.tick{border:0;border-left:1px solid var(--line);background:none;width:64px;cursor:pointer;display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tick .box{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:16px;color:transparent}
.clip.done .tick .box{background:var(--ok);border-color:var(--ok);color:#fff}
.clip.done .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.clip.done .say{color:var(--muted)}
details.donebox{margin-top:14px}
details.donebox summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);padding:6px 0}

.mid{border-left:3px solid var(--mc,var(--line));background:var(--bg);border-radius:0 8px 8px 0;padding:8px 10px;display:grid;gap:4px;font-size:14px}
.mid.M1{--mc:var(--m1)} .mid.M2{--mc:var(--m2)} .mid.M3{--mc:var(--m3)} .mid.M4{--mc:var(--m4)}
.mid b{font-weight:600}
.mid>span{display:block}
.k{color:var(--muted);font-size:12px;font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.panel ul{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:8px}
.panel li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.panel li input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:0 0 auto}
.vo{font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0}
textarea.copybox{width:100%;min-height:160px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}

/* schedule timeline */
.sched{margin-top:12px;display:grid;gap:0}
.slot{display:grid;grid-template-columns:62px 18px 1fr;gap:0 10px}
.slot .tm{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;text-align:right;padding-top:12px;line-height:1.25}
.slot .tm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.slot:first-child .rail::before{top:18px}
.slot:last-child .rail::before{bottom:calc(100% - 18px)}
.dot{position:relative;margin-top:14px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.slot.shoot .dot{border-color:var(--accent)}
.slot.meal .dot{border-color:var(--warn)}
.slot.fin .dot{border-color:var(--ok)}
.slot.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.card{margin:6px 0;border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);display:grid;gap:4px;text-align:left;width:100%}
button.card{cursor:pointer;font:inherit;color:inherit}
.slot.break .card,.slot.prep .card,.slot.fin .card{background:transparent;border-style:dashed}
.slot.meal .card{background:var(--warn-soft);border-color:transparent}
.slot.now .card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .ttl{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .dt{font-size:13px;color:var(--muted)}
.card .prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.card .prog .bar{flex:1}
.nowtag{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 8px}
.gohint{font-size:12px;font-weight:600;color:var(--accent)}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.phead .c{font-family:var(--mono);font-size:12px;color:var(--muted)}
.phead .c.full{color:var(--ok)}
.panel li label span.done{color:var(--muted);text-decoration:line-through}

/* prompter: deliberate single dark look, text pinned to the top edge near the lens */
.prompter{position:fixed;inset:0;background:#000;color:#fff;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.prompter[hidden]{display:none}
.p-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #222;font-size:14px;color:#aab0bb}
.p-top .where{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-top .where b{color:#fff}
.p-top button{background:#1a1a1a;border:1px solid #3a3a3a;color:#fff;border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer}
.p-body{flex:1;overflow-y:auto;padding:18px clamp(18px,4vw,48px) 24px;display:flex;flex-direction:column;gap:14px}
.p-lbl{font-size:14px;font-weight:700;color:#ff8a78;letter-spacing:.06em}
.p-text{font-size:calc(var(--pf,1) * clamp(30px,5.2vw,64px));line-height:1.32;font-weight:600;text-wrap:pretty;max-width:26em}
.p-gap{font-size:14px;color:#7d838e}
.p-hint{font-size:14px;color:#9aa0ab}
.p-bar{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;padding:10px 12px 12px;border-top:1px solid #222}
.p-bar button{background:#1a1a1a;color:#fff;border:1px solid #3a3a3a;border-radius:12px;padding:14px 8px;font-weight:700;font-size:16px;cursor:pointer}
.p-bar button.pass{background:#1f8a5b;border-color:#1f8a5b;font-size:17px}
.p-bar button:disabled{opacity:.35}
.p-done{flex:1;display:grid;place-content:center;gap:16px;text-align:center;padding:24px}
.p-done h2{font-size:30px}
.p-done p{color:#aab0bb;margin:0;font-size:16px}
.p-done button{background:#1f8a5b;border:0;color:#fff;border-radius:12px;padding:16px 20px;font-weight:700;font-size:18px;cursor:pointer}

/* slate: ถือไอแพดให้กล้องถ่ายก่อนเริ่มคลิป — หน้าตาแบบสเลทกองถ่าย
   แนวนอน: เลขข้อเต็มคอลัมน์ซ้าย · ข้อมูลกับบทอยู่คอลัมน์ขวา */
.slate{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr;gap:clamp(8px,1.6vh,16px);padding:0 clamp(12px,2.2vw,26px) clamp(10px,1.8vh,18px)}
.slate .s-clap{height:clamp(18px,3.2vh,30px);margin-inline:calc(-1 * clamp(12px,2.2vw,26px));background:repeating-linear-gradient(115deg,#fff 0 34px,#111 34px 68px);border-bottom:2px solid #fff}
.slate .s-body{display:grid;grid-template-columns:44% 1fr;gap:clamp(12px,2.2vw,26px);min-height:0}
.slate .s-numbox{border:3px solid #fff;border-radius:16px;display:grid;place-content:center;justify-items:center;min-height:0;padding:6px}
.slate .s-numlbl{font-size:min(clamp(13px,1.8vw,22px),3vh);font-weight:700;color:#ff8a78;letter-spacing:.2em}
.slate .s-num{font-family:var(--mono);font-size:min(62vh,31vw);font-weight:600;line-height:.95;letter-spacing:-.02em}
.slate .s-right{display:grid;grid-template-rows:auto 1fr;gap:clamp(8px,1.6vh,16px);min-height:0;min-width:0}
.slate .s-meta{display:grid;gap:clamp(3px,.8vh,8px);align-content:start;min-width:0}
.slate .s-row{display:grid;grid-template-columns:clamp(52px,6vw,80px) 1fr;gap:10px;align-items:baseline;border-bottom:1px solid #2a2a2a;padding-bottom:clamp(3px,.7vh,7px)}
.slate .s-row:last-child{border-bottom:0}
.slate .s-k{font-size:min(clamp(12px,1.4vw,19px),2.6vh);font-weight:700;color:#9aa0ab;letter-spacing:.12em}
.slate .s-v{font-size:min(clamp(17px,2.2vw,34px),4vh);font-weight:700;min-width:0;overflow-wrap:anywhere}
.slate .s-done{color:#6fdca6}
.slate .s-lines{display:grid;gap:clamp(8px,1.6vh,16px);align-content:center;min-height:0}
.slate .s-line{display:grid;gap:2px;border-left:4px solid var(--lc,#ff8a78);padding-left:clamp(8px,1.2vw,14px);min-width:0}
.slate .s-line.close{--lc:#6fdca6}
.slate .s-line .s-k{color:var(--lc,#ff8a78)}
.slate .s-say{font-size:min(clamp(20px,3.1vw,46px),5.6vh);font-weight:600;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@media (orientation:portrait){
  .slate .s-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .slate .s-numbox{padding:8px clamp(18px,6vw,40px)}
  .slate .s-num{font-size:min(30vh,42vw)}
  .slate .s-say{font-size:min(clamp(18px,3.4vw,40px),4.6vh)}
}
.p-top button.viewbtn{background:#2a2a2a;border-color:#4a4a4a}
/* ล้างสถานะ: ซ่อนไว้ท้ายหน้า ต้องยืนยันก่อน กันกดพลาดระหว่างถ่าย */
.resetwrap{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);text-align:center}
.resetbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.resetbtn:hover{border-color:var(--accent);color:var(--accent)}
.resetnote{font-size:12px;color:var(--muted);margin-top:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#fff;color:#111;border-radius:999px;padding:8px 8px 8px 16px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
.toast button{background:#111;color:#fff;border:0;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion: reduce){.bar i,.daybar i{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <div class="topbar">
    <div class="titlerow">
      <h1>คิวถ่าย CoachTarn</h1>
      <span class="day" id="day"></span>
      <button type="button" class="themebtn" id="fsbtn" aria-label="เต็มจอ">⛶</button>
      <button type="button" class="themebtn" id="uibtn" data-ui-cycle="1" aria-label="ขนาดตัวอักษร">Aa</button>
      <button type="button" class="themebtn" id="themebtn" data-theme-cycle="1" aria-label="สลับธีม"></button>
      <div class="mode" role="group" aria-label="โหมด">
        <button type="button" class="mbtn" id="mode-coach" data-mode="coach">โค้ช</button>
        <button type="button" class="mbtn" id="mode-ice" data-mode="ice">ไอซ์</button>
      </div>
    </div>
    <div class="daybar" aria-hidden="true"><i id="daybar"></i></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
  <main id="view"></main>
  <div class="resetwrap">
    <button type="button" class="resetbtn" id="resetBtn">ล้างสถานะที่ติ๊กไว้</button>
    <div class="resetnote" id="resetNote"></div>
  </div>
</div>

<div class="prompter" id="prompter" hidden role="dialog" aria-label="หน้าจออ่านบท">
  <div class="p-top">
    <span class="where" id="pWhere"></span>
    <button type="button" id="pSm" aria-label="ตัวเล็กลง">A−</button>
    <span class="pct" id="pPct"></span>
    <button type="button" id="pLg" aria-label="ตัวใหญ่ขึ้น">A+</button>
    <button type="button" id="pFs" aria-label="เต็มจอ">⛶</button>
  <button type="button" id="pView" class="viewbtn" aria-label="สลับสเลท/บท">สเลท</button>
  <button type="button" id="pClose" aria-label="ปิดหน้าจออ่านบท">✕</button>
  </div>
  <div class="p-body" id="pBody"></div>
  <div class="p-bar" id="pBar">
    <button type="button" id="pPrev">‹ ย้อน</button>
    <button type="button" id="pSkip">ข้าม</button>
    <button type="button" id="pPass" class="pass">✓ ผ่าน ไปต่อ</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button type="button" id="toastUndo">เลิกทำ</button></div>

<script>

function clipsFor(loc){
  const list = CLIPS.filter(c=>c.loc===loc);
  const day = list.filter(c=>!c.night), night = list.filter(c=>c.night);
  day.sort((a,b)=>(PRI.has(b.n)-PRI.has(a.n)));
  return day.concat(night);
}

/* เต็มจอ: iPad Safari บางรุ่นไม่มี Fullscreen API → บอกวิธีเพิ่มลงหน้าจอโฮมแทน */
const isStandalone = navigator.standalone===true || matchMedia('(display-mode: standalone)').matches;
function fsActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function fsHelp(){
  alert('เปิดแบบเต็มจอบน iPad\n\n1. กดปุ่มแชร์ (สี่เหลี่ยมมีลูกศรขึ้น) บนแถบ Safari\n2. เลือก "เพิ่มลงในหน้าจอโฮม"\n3. เปิดหน้านี้จากไอคอนบนหน้าจอโฮม\n\nจะเต็มจอ ไม่มีแถบ URL และสถานะที่ติ๊กไว้ยังอยู่ครบ');
}
function toggleFS(){
  try{
    if(fsActive()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    const el=document.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!req) return fsHelp();
    const r=req.call(el); if(r&&r.catch) r.catch(fsHelp);
  }catch(e){ fsHelp(); }
}
function drawFS(){
  const on=fsActive();
  [document.getElementById('fsbtn'),document.getElementById('pFs')].forEach(b=>{
    if(!b) return;
    b.hidden = isStandalone;              // เปิดจากไอคอนหน้าจอโฮมอยู่แล้ว ไม่ต้องมีปุ่ม
    b.textContent = on ? '⤡' : '⛶';
    b.title = on ? 'ออกจากเต็มจอ' : 'เต็มจอ';
  });
}
document.getElementById('fsbtn').onclick=toggleFS;
document.getElementById('pFs').onclick=toggleFS;
document.addEventListener('fullscreenchange',drawFS);
document.addEventListener('webkitfullscreenchange',drawFS);
drawFS();

  return `<section class="hero"><h2>ช่วงกลาง · ไอซ์ถ่ายเองที่บ้าน</h2>
    <p class="scene">ถ่ายใกล้ๆ ให้เห็นแค่จอหรือสไลด์ ติดมือได้ · ยาวราว 7–8 วิ · เสียง AI ตั้งความเร็ว 1.1 เท่า · เฟรมแรกต้องตรงกับเรื่องที่โค้ชพูดตอนเปิด</p></section>
  ${MID.map(g=>`<div class="panel"><h3><span class="chip ${g.m}">${g.m} ${esc(M[g.m])}</span></h3><div class="vo"><span class="k">เสียง AI</span><br>${esc(g.vo)}</div>${checklist('mid-'+g.m,g.items,'mid')}</div>`).join('')}`;
}
const SCHED=[
 {s:'ก่อน',e:'13:00',type:'meal',title:'🍚 กินข้าวเที่ยง + จัดของ',dt:'กินให้อิ่มก่อนเริ่ม · ชาร์จทุกเครื่อง · วางชุดทั้ง 3 ชุดไว้ในห้อง'},
 {s:'13:00',e:'13:15',type:'prep',title:'เซ็ตกล้องและไมค์',dt:'ที่ส่วนกลาง · ถ่ายทดสอบเสียง 1 คลิป'},
 {s:'13:15',e:'14:00',type:'shoot',loc:'common'},
 {s:'14:00',e:'14:50',type:'shoot',loc:'view'},
 {s:'14:50',e:'15:10',type:'break',title:'พัก + เปลี่ยนชุด 2',dt:'ดื่มน้ำ ซับหน้า · ย้ายไปริมสระ'},
 {s:'15:10',e:'16:25',type:'shoot',loc:'pool'},
 {s:'16:25',e:'16:50',type:'break',title:'พักกินของว่าง + เปลี่ยนชุด 3',dt:'เซ็ตมุมโต๊ะทำงานในห้อง'},
 {s:'16:50',e:'18:00',type:'shoot',loc:'room',part:'day'},
 {s:'18:00',e:'18:40',type:'meal',title:'🍚 กินข้าวเย็น',dt:'รอฟ้ามืด · ก่อนกลับมาถ่าย เปิดโคมไฟโต๊ะ ปิดไฟเพดาน'},
 {s:'18:40',e:'19:00',type:'shoot',loc:'room',part:'night'},
 {s:'19:00',e:'',type:'fin',title:'เสร็จ',dt:'เช็กในมือถือว่าไฟล์ครบก่อนเก็บของ'},
];
const SHOOT_DAY='2026-09-20';
function toMin(t){const m=/^(\d\d):(\d\d)$/.exec(t);return m?(+m[1])*60+(+m[2]):null;}
function nowIndex(){
  const d=new Date(); const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if(iso!==SHOOT_DAY) return -1;
  const m=d.getHours()*60+d.getMinutes();
  for(let i=SCHED.length-1;i>=0;i--){const st=toMin(SCHED[i].s); if(st!=null&&m>=st) return i;}
  return 0;
}
function slotClips(x){let l=clipsFor(x.loc); if(x.part==='day') l=l.filter(c=>!c.night); if(x.part==='night') l=l.filter(c=>c.night); return l;}
function renderSched(){
  const ni=nowIndex();
  const rows=SCHED.map((x,i)=>{
    const now=i===ni?' now':'';
    const tm=`<div class="tm">${esc(x.s)}${x.e?`<small>${x.s==='ก่อน'?'':'ถึง '}${esc(x.e)}</small>`:''}</div>`;
    let card;
    if(x.type==='shoot'){
      const L=LOCS.find(l=>l.id===x.loc), cl=slotClips(x), d=cl.filter(c=>isDone(c.n)).length;
      const name=L.name+(x.part==='day'?' · ช่วงกลางวัน':x.part==='night'?' · กลางคืน':'');
      const sub=x.part==='night'?'ข้อ 11, 12, 30 · เปิดโคมไฟโต๊ะ':L.outfit;
      card=`<button type="button" class="card" data-tab="${x.loc}">
        <span class="ttl">🎬 ${esc(name)} ${i===ni?'<span class="nowtag">ตอนนี้</span>':''}</span>
        <span class="dt">${esc(sub)}</span>
        <span class="prog"><span class="bar"><i style="width:${d/cl.length*100}%"></i></span>${d===cl.length?'✓ ครบ':d+'/'+cl.length+' คลิป'}</span>
        <span class="gohint">เปิดคิว ›</span></button>`;
    } else {
      card=`<div class="card"><span class="ttl">${esc(x.title)} ${i===ni?'<span class="nowtag">ตอนนี้</span>':''}</span><span class="dt">${esc(x.dt)}</span></div>`;
    }
    return `<div class="slot ${x.type}${now}">${tm}<div class="rail"><span class="dot"></span></div>${card}</div>`;
  }).join('');
  return `<section class="hero"><div class="hero-head"><h2>ตารางวันนี้</h2><span class="mono small">อา. 20 ก.ย. · 13:00–19:00</span></div>
    <p class="scene">ถ้าช้ากว่าตารางเกิน 15 นาที ให้ข้ามคลิปที่ไม่มีป้าย "ชุดแรก" ในสถานที่นั้นแล้วไปต่อ · แตะการ์ด 🎬 เพื่อเปิดคิวของสถานที่นั้น</p></section>
    <div class="sched">${rows}</div>`;
}
const PREP=[
 ['📱 อุปกรณ์ถ่าย',['มือถือเครื่องหลัก · กล้องหลัง 4K แนวตั้ง · พื้นที่ว่างเกิน 20 GB','ขาตั้งมือถือ','ไมค์หนีบปก + แบตหรือสายสำรอง','ไฟ LED ดวงเล็ก (วิวตึกสูงกับในห้อง)','iPad หรือมือถือเครื่องที่ 2 เปิดหน้านี้ไว้อ่านบท · ปิดล็อกจออัตโนมัติ','พาวเวอร์แบงก์ 1–2 ก้อน + สายชาร์จ']],
 ['🗂 ของประกอบฉาก',['กระดาษ A4 พิมพ์สไลด์รกๆ 2–3 แผ่น (ข้อ 14)','โน้ตบุ๊กหรือ iPad เปิดหน้า Chart / Map / Org Chart ค้างไว้ (วิวตึกสูง)','โคมไฟโต๊ะ (ข้อ 11, 12, 30)']],
 ['👕 ชุดโค้ช',['ชุด 1 · เชิ้ต + เบลเซอร์ (ส่วนกลาง, วิวตึกสูง)','ชุด 2 · โปโลหรือเชิ้ตลำลองสีสว่าง (ริมสระ)','ชุด 3 · ชุดอยู่บ้านแบบดูดี (ห้อง)','เลี่ยงลายริ้วเล็กๆ เพราะจะกระพริบในวิดีโอ']],
 ['💧 ของใช้ระหว่างวัน',['น้ำดื่มให้โค้ช','ทิชชูหรือแป้งซับหน้า','ข้าวเย็นหรือสั่งเดลิเวอรีไว้ก่อน 17:45']],
 ['✅ ก่อน 13:00',['ชาร์จทุกเครื่องเต็ม','เปิดหน้านี้บน iPad ได้ (ถ้าคนละบัญชี ต้องแชร์ลิงก์ก่อน)','ทดสอบไมค์ อัดสั้นๆ แล้วฟังเสียง']],
 ['🎥 ก่อนกดอัดทุกครั้ง',['หน้าโค้ชอยู่ช่วงบนค่อนกลางจอ เว้นด้านล่างราว 25%','นิ่ง 1 วิ แล้วพูดทันที ไม่ทักทาย','เว้น 2 วิระหว่างเปิดกับปิด','พูด "กดปุ่มด้านล่าง" แล้วชี้นิ้วลง','ไม่เกิน 2 เทคต่อคลิป','ทุก 5 คลิปสลับมุม ใกล้ ↔ ครึ่งตัว']],
 ['✂️ ตอนตัดต่อ (วันหลัง)',['ตัดให้คลิปเริ่มที่คำแรกพอดี','ข้อความบนจอตรงกับที่โค้ชพูด','ปิดท้าย: 499 บาท จ่ายครั้งเดียว ออกใบกำกับภาษีได้ + ลูกศรชี้ลง','รวมไม่เกิน 15 วิ ถ้าเกินให้ย่นช่วงกลางก่อน','ชุดแรกที่ยิงแอด: 17 คลิปที่มีป้าย "ชุดแรก"']],
];
function renderPrep(){
  let tot=0,don=0; PREP.forEach((g,gi)=>g[1].forEach((_,i)=>{tot++; if(state.prep[`prep-${gi}-${i}`]) don++;}));
  return `<section class="hero"><div class="hero-head"><h2>ของที่ต้องเตรียม</h2><span class="mono small" id="prepcount">${don}/${tot}</span></div>
    <div class="bar"><i id="prepbar" style="width:${don/tot*100}%"></i></div></section>`+
  PREP.map((g,gi)=>{const n=g[1].length,d=g[1].filter((_,i)=>state.prep[`prep-${gi}-${i}`]).length;
    return `<div class="panel"><div class="phead"><h3>${esc(g[0])}</h3><span class="c${d===n?' full':''}" id="pc-${gi}">${d===n?'✓ ครบ':d+'/'+n}</span></div>${checklist('prep-'+gi,g[1],'prep')}</div>`}).join('');
}

function doneCount(){
  const clips=CLIPS.filter(c=>isDone(c.n)||state.skip[c.n]).length;
  const checks=Object.values(state.prep).filter(Boolean).length+Object.values(state.mid).filter(Boolean).length;
  return {clips,checks};
}
function drawReset(){
  const {clips,checks}=doneCount();
  const b=document.getElementById('resetBtn'), note=document.getElementById('resetNote');
  b.disabled = !clips && !checks;
  b.style.opacity = b.disabled ? .45 : 1;
  note.textContent = clips||checks ? `ตอนนี้ติ๊กไว้ ${clips} ข้อ · เช็กลิสต์ ${checks} ช่อง` : 'ยังไม่มีอะไรติ๊กไว้';
}
document.getElementById('resetBtn').onclick=()=>{
  const {clips,checks}=doneCount();
  if(!confirm(`ล้างสถานะทั้งหมด?\n\nข้อที่ถ่ายแล้ว/ข้าม ${clips} ข้อ และเช็กลิสต์ ${checks} ช่อง จะถูกล้าง (ธีมกับขนาดตัวอักษรยังอยู่)`)) return;
  state.done={}; state.skip={}; state.mid={}; state.prep={};
  save(); render(); flash('ล้างสถานะแล้ว');
};
function render(){
  renderTop();
  const v=document.getElementById('view');
  v.innerHTML = state.tab==='sched'?renderSched():state.tab==='mid'?renderMid():state.tab==='prep'?renderPrep():renderLoc(state.tab);
  const t=document.getElementById('tab-'+state.tab); if(t) t.scrollIntoView({block:'nearest',inline:'nearest'});
}

/* ---------- prompter ---------- */
let pLoc=null, pList=[], pIdx=0, wake=null, lastPass=null;
/* สเลท: ถือไอแพดถ่ายหน้าคลิป — แนวนอน = สเลท, แนวตั้ง = บท
   iPad ที่ล็อกหมุนจอไว้จะไม่ส่ง event นี้เลย ปุ่ม "สเลท/บท" จึงต้องมีเสมอ */
const mqLand = matchMedia('(orientation:landscape)');
let slateOn = mqLand.matches, slateAuto = true;
mqLand.addEventListener('change', e=>{ if(P.hidden||!slateAuto) return; slateOn = e.matches; drawP(); });
const P=document.getElementById('prompter'), PB=document.getElementById('pBody'), PBar=document.getElementById('pBar');
async function keepAwake(){try{if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen');}catch(e){wake=null;}}
document.addEventListener('visibilitychange',()=>{if(!P.hidden&&document.visibilityState==='visible')keepAwake();});
function openPrompter(loc,n){
  pLoc=loc; pList=clipsFor(loc);
  pIdx = n!=null ? pList.findIndex(c=>c.n===n) : firstTodo();
  if(pIdx<0) pIdx=0;
  P.hidden=false; document.body.style.overflow='hidden'; slateAuto=true; slateOn=mqLand.matches; keepAwake(); drawP();
}
function firstTodo(){let i=pList.findIndex(c=>!isDone(c.n)&&!state.skip[c.n]); if(i<0) i=pList.findIndex(c=>!isDone(c.n)); return i;}
function nextTodo(from){
  const L=pList.length;
  for(let k=1;k<=L;k++){const i=(from+k)%L,c=pList[i]; if(!isDone(c.n)&&!state.skip[c.n]) return i;}
  for(let k=1;k<=L;k++){const i=(from+k)%L,c=pList[i]; if(!isDone(c.n)) return i;}
  return -1;
}
function drawP(){
  const L=LOCS.find(l=>l.id===pLoc), left=pList.filter(c=>!isDone(c.n)).length;
  P.style.setProperty('--pf',state.pf); document.getElementById('pPct').textContent=Math.round(state.pf*100)+'%';
  if(pIdx<0){
    const nx=nextLoc(pLoc);
    document.getElementById('pWhere').innerHTML=`<b>${esc(L.name)}</b> · ครบแล้ว`;
    PB.innerHTML=`<div class="p-done"><h2>ครบรอบ${esc(L.name)} 🎉</h2>${nx?`<p>ต่อไป: <b style="color:#fff">${esc(nx.name)}</b> · ${esc(nx.outfit)}</p><button type="button" id="pNextLoc">เริ่ม${esc(nx.name)} ▶</button>`:'<p>ถ่ายครบทั้ง 50 คลิปแล้ว</p>'}</div>`;
    PBar.hidden=true;
    const b=document.getElementById('pNextLoc'); if(b) b.onclick=()=>{state.tab=nx.id;save();render();openPrompter(nx.id,null);};
    return;
  }
  PBar.hidden=false;
  const c=pList[pIdx];
  document.getElementById('pWhere').innerHTML=`<b>ข้อ ${c.n}</b> · ${esc(L.name)} · เหลือ ${left}${isDone(c.n)?' · <span style="color:#6fdca6">ถ่ายแล้ว</span>':''}`;
  const vb=document.getElementById('pView'); if(vb){vb.textContent=slateOn?'บท':'สเลท'; vb.title=slateOn?'ดูบทที่ต้องพูด':'ดูสเลทสำหรับถ่ายหน้าคลิป';}
  if(slateOn){
    PB.innerHTML=`<div class="slate">
      <div class="s-clap" aria-hidden="true"></div>
      <div class="s-body">
        <div class="s-numbox"><div class="s-numlbl">ข้อ</div><div class="s-num">${c.n}</div></div>
        <div class="s-right">
        <div class="s-meta">
          <div class="s-row"><span class="s-k">สถานที่</span><span class="s-v">${esc(L.name)}</span></div>
          <div class="s-row"><span class="s-k">ชุด</span><span class="s-v">${esc(L.outfit)}</span></div>
          <div class="s-row"><span class="s-k">หมวด</span><span class="s-v">${esc(M[c.m]||c.m)}${c.t?' · '+esc(c.t):''}${isDone(c.n)?' <span class="s-done">· ถ่ายแล้ว</span>':''}</span></div>
        </div>
        <div class="s-lines">
        <div class="s-line"><span class="s-k">ประโยคเปิด</span><p class="s-say">${esc(c.o)}</p></div>
        <div class="s-line close"><span class="s-k">ประโยคปิด</span><p class="s-say">${esc(c.c)}</p></div>
        </div>
      </div>
      </div>
    </div>`;
    PB.scrollTop=0;
    document.getElementById('pPrev').disabled=pIdx===0;
    document.getElementById('pSkip').disabled=left<=1&&!isDone(c.n);
    document.getElementById('pPass').textContent=isDone(c.n)?'ถัดไป ›':'✓ ผ่าน ไปต่อ';
    return;
  }
  PB.innerHTML=`<div><div class="p-lbl">เปิด</div><div class="p-text">${esc(c.o)}</div></div>
    <div class="p-gap">· เว้น 2 วิ ·</div>
    <div><div class="p-lbl">ปิด</div><div class="p-text">${esc(c.c)}</div></div>
    <div class="p-hint">👇 ชี้นิ้วลงตอนพูด "กดปุ่มด้านล่าง"${c.note?' · 📌 '+esc(c.note):''}</div>`;
  PB.scrollTop=0;
  document.getElementById('pPrev').disabled=pIdx===0;
  document.getElementById('pSkip').disabled=left<=1&&!isDone(c.n);
  document.getElementById('pPass').textContent=isDone(c.n)?'ถัดไป ›':'✓ ผ่าน ไปต่อ';
}
const _render=render; render=function(){_render.apply(this,arguments); drawReset();};
function closeP(){P.hidden=true;document.body.style.overflow='';hideToast();try{wake&&wake.release();}catch(e){} wake=null;render();}
let toastT=null;
function flash(msg){showToast(msg,false);}
function showToast(msg,undo=true){document.getElementById('toastUndo').hidden=!undo;document.getElementById('toastMsg').textContent=msg;document.getElementById('toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(hideToast,4000);}
function hideToast(){document.getElementById('toast').hidden=true;lastPass=null;}
document.getElementById('toastUndo').onclick=()=>{if(lastPass){delete state.done[lastPass.n];save();pIdx=lastPass.idx;} hideToast();drawP();};
document.getElementById('pPass').onclick=()=>{
  const c=pList[pIdx];
  if(!isDone(c.n)){state.done[c.n]=true;delete state.skip[c.n];save();lastPass={n:c.n,idx:pIdx};showToast(`ข้อ ${c.n} ผ่านแล้ว`);}
  pIdx=nextTodo(pIdx); slateAuto=true; slateOn=mqLand.matches; drawP();
};
document.getElementById('pSkip').onclick=()=>{const c=pList[pIdx]; state.skip[c.n]=true; save(); const n=nextTodo(pIdx); if(n>=0) pIdx=n; slateAuto=true; slateOn=mqLand.matches; drawP();};
document.getElementById('pPrev').onclick=()=>{if(pIdx>0){pIdx--;slateAuto=true;slateOn=mqLand.matches;drawP();}};
document.getElementById('pView').onclick=()=>{slateOn=!slateOn; slateAuto=false; drawP();};
document.getElementById('pSm').onclick=()=>{state.pf=Math.max(.6,+(state.pf-.1).toFixed(1));save();drawP();flash('ขนาด '+Math.round(state.pf*100)+'% · จำไว้แล้ว');};
document.getElementById('pLg').onclick=()=>{state.pf=Math.min(1.8,+(state.pf+.1).toFixed(1));save();drawP();flash('ขนาด '+Math.round(state.pf*100)+'% · จำไว้แล้ว');};
document.getElementById('pClose').onclick=closeP;
document.addEventListener('keydown',e=>{if(P.hidden)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!PBar.hidden)document.getElementById('pPass').click();}
  if(e.key==='ArrowLeft')document.getElementById('pPrev').click();
  if(e.key==='ArrowRight')document.getElementById('pSkip').click();
  if(e.key==='Escape')closeP();});

function scriptText(loc){const L=LOCS.find(l=>l.id===loc);return `${L.name} (${L.time})\n\n`+clipsFor(loc).map(c=>`ข้อ ${c.n}\n${c.o}\n\n(เว้น 2 วิ)\n\n${c.c}\n\n————\n`).join('\n');}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-ui-cycle],[data-theme-cycle],[data-tab],[data-prompt],[data-start],[data-copy],[data-mode],[data-tick],[data-howseen]'); if(!t) return;
  if(t.dataset.uiCycle){const i=UIS.indexOf(state.ui||1);state.ui=UIS[(i+1)%UIS.length];save();applyUI();flash(UINAME[state.ui]+' · จำไว้แล้ว');return;}
  if(t.dataset.themeCycle){const i=THEMES.indexOf(state.theme||'auto');state.theme=THEMES[(i+1)%3];save();applyTheme();return;}
  if(t.dataset.mode){state.mode=t.dataset.mode;save();render();return;}
  if(t.dataset.howseen){state.howSeen=true;save();render();return;}
  if(t.dataset.tab){state.tab=t.dataset.tab;save();render();window.scrollTo({top:0});return;}
  if(t.dataset.tick){const n=+t.dataset.tick; if(isDone(n)) delete state.done[n]; else {state.done[n]=true;delete state.skip[n];} save(); render(); return;}
  if(t.dataset.prompt){openPrompter(state.tab,+t.dataset.prompt);return;}
  if(t.dataset.start){openPrompter(t.dataset.start,null);return;}
  if(t.dataset.copy){
    const txt=scriptText(t.dataset.copy);
    try{await navigator.clipboard.writeText(txt);t.textContent='คัดลอกแล้ว ✓';}
    catch(err){const box=document.getElementById('copyfallback-'+t.dataset.copy);box.innerHTML='<p class="small" style="margin:4px 0">กดค้างในกล่อง เลือกทั้งหมด แล้วคัดลอก</p><textarea class="copybox" id="copybox-'+t.dataset.copy+'" readonly></textarea>';const ta=box.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
  }
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.mid){state.mid[t.dataset.mid]=t.checked;save();t.nextElementSibling.classList.toggle('done',t.checked);}
  if(t.dataset.prep){state.prep[t.dataset.prep]=t.checked;save();render();}});

applyUI();
applyTheme();
render();
</script>
