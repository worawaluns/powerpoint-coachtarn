<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>คลังเทมเพลตตามอาชีพ — Coach Tarn</title>
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--red:#D34724;--orange:#EB7D4A;--text:#15151A;--mid:#4A4A55;--sub:#8A8A96;--line:#ECECF0;--soft:#FFF6F2;--bg:#F6F6F8;--white:#fff;--ease:cubic-bezier(.16,1,.3,1)}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 rgba(0,0,0,.07)}
.nav-logo{display:flex;align-items:center;height:36px}.nav-logo svg{height:36px;width:auto}
.nav-r{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:100px;font-family:inherit;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-red{background:linear-gradient(-135deg,var(--orange),var(--red));color:#fff;box-shadow:0 6px 16px rgba(211,71,36,.28);padding:10px 20px;font-size:15px}
.btn-ghost{background:#fff;color:var(--text);border:1.5px solid var(--line);padding:9px 18px;font-size:14px}
.btn svg{width:18px;height:18px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:100px;padding:4px 12px;font-size:12px;font-weight:700}

.hero{padding:44px 0 22px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.eyebrow{color:var(--red);font-weight:700;font-size:14px;letter-spacing:.5px}
h1{font-size:clamp(30px,5vw,46px);font-weight:800;line-height:1.15;margin-top:6px}
.lead{color:var(--mid);font-size:16px;margin-top:10px;max-width:620px;line-height:1.6}
.stats{display:flex;gap:26px}.stat b{display:block;font-size:26px;font-weight:800;color:var(--red)}.stat span{font-size:13px;color:var(--sub)}
/* member / redeem */
.member{margin-top:22px;border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.member.locked{background:#fff;border:1.5px dashed #F2C4B4}
.member.open{background:linear-gradient(120deg,#E8F8EF,#F3FBF6);border:1.5px solid #BFE8CF}
.member .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.member.locked .ic{background:var(--soft);color:var(--red)}.member.open .ic{background:#1E9E5A;color:#fff}
.member .tx{flex:1;min-width:220px}.member .tx b{font-size:16px}.member .tx p{font-size:13px;color:var(--sub);margin-top:2px}
.rd{display:flex;gap:8px;flex-wrap:wrap}
.rd input{font-family:inherit;font-size:15px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);width:210px;text-transform:uppercase;letter-spacing:1px;outline:none}
.rd input:focus{border-color:var(--red)}
.err{color:#D93A2B;font-size:13px;margin-top:6px;display:none}
/* filters */
.bar{position:sticky;top:56px;z-index:20;background:var(--bg);padding:14px 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:100px;padding:8px 15px;font-family:inherit;font-size:14px;font-weight:600;color:var(--mid);cursor:pointer;white-space:nowrap}
.chip small{color:var(--sub);font-weight:500;margin-left:4px}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}.chip.on small{color:#bbb}
.search{position:relative}.search input{font-family:inherit;font-size:14px;padding:9px 14px 9px 36px;border-radius:100px;border:1.5px solid var(--line);width:220px;outline:none;background:#fff}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--sub)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding:8px 0 70px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,20,40,.06);transition:transform .35s var(--ease),box-shadow .35s var(--ease);display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(20,20,40,.12)}
.cv{position:relative;aspect-ratio:3/2;overflow:hidden;background:#eee}.cv img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.card:hover .cv img{transform:scale(1.04)}
.new{position:absolute;top:12px;right:12px;background:#fff;color:var(--red);font-size:11px;font-weight:800;padding:4px 10px;border-radius:100px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cb{padding:14px 16px 16px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex:1}
.cb h3{font-size:17px;font-weight:700;line-height:1.35}.cb .en{font-size:12px;color:var(--sub);margin-top:2px}
.meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.m1{background:var(--soft);color:var(--red)}.m2{background:#F1F2F6;color:var(--mid)}
.dl{flex-shrink:0;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:none;cursor:pointer;background:#F1F2F6;color:var(--mid)}
.dl.open{background:linear-gradient(-135deg,var(--orange),var(--red));color:#fff;box-shadow:0 6px 14px rgba(211,71,36,.3)}
.dl svg{width:19px;height:19px}
/* browse mode: by set / by slide type */
.mode{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:100px;padding:4px;gap:4px;margin-top:22px}
.mode button{border:none;background:none;border-radius:100px;padding:9px 18px;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--mid);cursor:pointer}
.mode button.on{background:var(--text);color:#fff}
.types{display:none;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 0 12px}.types::-webkit-scrollbar{display:none}.types.show{display:flex}
.types .chip.on{background:var(--red);border-color:var(--red)}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.sl{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(20,20,40,.06);transition:transform .3s var(--ease),box-shadow .3s}
.sl:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(20,20,40,.12)}
.sl img{width:100%;aspect-ratio:16/9;display:block;background:#eef0f4}
.sl div{padding:9px 12px 11px;font-size:13px;display:flex;gap:6px;align-items:center;min-width:0}.sl div b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mid)}
.sl .pill{flex-shrink:0;padding:2px 8px;font-size:11px}
.more{grid-column:1/-1;justify-self:center}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#15151A;color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;transition:transform .4s var(--ease);z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:640px){.hero{padding:26px 0 10px}.stats{gap:18px}.search input{width:100%}.search{flex:1 1 100%}.rd input{flex:1;width:auto}.rd{width:100%}.bar{top:56px}}
</style>
</head>

  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  const T = document.getElementById('types'), g = document.getElementById('grid');
  T.classList.toggle('show', mode === 'slides'); g.classList.toggle('sgrid', mode === 'slides');
  if (mode === 'sets') return renderSets();
  const sets = DATA.filter(d => (group === 'all' || d.group === group) && (!q || (d.th + d.en + d.cat).toLowerCase().includes(q)));
  T.innerHTML = [['all', 'ทุกประเภท']].concat(TYPES.map(t => [t, t])).map(([k, t]) => {
    const n = k === 'all' ? sets.reduce((a, d) => a + (TAGS[d.slug] || []).length, 0) : sets.reduce((a, d) => a + (TAGS[d.slug] || []).filter(x => x === k).length, 0);
    return n ? `<button class="chip ${k === type ? 'on' : ''}" onclick="setType('${k}')">${t}<small>${n}</small></button>` : ''; }).join('');
  const list = slideList(sets);
  g.innerHTML = list.length ? list.slice(0, shown).map(([d, k, t]) => `<a class="sl" href="template.html?id=${d.slug}&s=${k}" title="${esc(d.th)} · สไลด์ ${k}">
      <img loading="lazy" src="library/slides/${d.slug}/${String(k).padStart(2, '0')}.jpg" alt="${esc(t)} จากชุด ${esc(d.th)}"><div><span class="pill m1">${esc(t)}</span><b>${esc(d.th)}</b></div></a>`).join('')
      + (list.length > shown ? `<button class="btn btn-ghost more" onclick="shown += 48; render()">ดูเพิ่ม (เหลืออีก ${list.length - shown} สไลด์)</button>` : '')
    : '<div class="empty">ไม่พบสไลด์ประเภทนี้ในกลุ่มที่เลือก</div>';
}
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
Promise.all([fetch('library/data.json').then(r => r.json()), fetch('library/slides.json').then(r => r.json()).catch(() => ({}))]).then(([d, t]) => {
  TAGS = t;
  DATA = d; document.getElementById('stN').textContent = d.length; // ponytail: total = whole bundle incl. existing archive, matches landing page claim
  renderMember(); renderChips(); render();
});
</script>
</body>
</html>
