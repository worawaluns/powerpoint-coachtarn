<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เทมเพลต | Coach Tarn</title>
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* หน้าเทมเพลตแบบ dd (ไอซ์ 3 พ.ย. 2569 อนุมัติ e-template-*-full-dd): ไม่มี eyebrow/ภาษาอังกฤษ/เลข 01-05/กล่องตัวเลข/การ์ดไอคอน ปุ่มแถวเดียว ส้มทึบเรียบ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--red:#C84B2F;--text:#111114;--mid:#4A4A55;--sub:#6B6B74;--line:rgba(17,17,20,.09);--edge:#DCDAD5;--fill:#F1F0ED;--bg:#FAFAF8;--ease:cubic-bezier(.2,.8,.2,1);--c1:#2F6BFF;--c2:#14B8A6}
body{font-family:"Sukhumvit Set","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit;text-decoration:none}
h1,h2,h3{text-wrap:balance}p{text-wrap:pretty}::selection{background:rgba(200,75,47,.18)}
.wrap{max-width:1232px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 16px;border-radius:12px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid var(--edge);background:#fff;color:var(--text)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}   /* ไอซ์ 3 พ.ย.: ส้มทึบเรียบ ไม่ไล่สี ไม่มีเงาส้ม ไม่เต้น */
.btn svg,.btn img{width:22px;height:22px;flex:none;display:block}
.btn.ico{width:52px;padding:0;flex:none}
.btn .ls{display:none}@media(max-width:640px){.btn .lw{display:none}.btn .ls{display:inline}}
/* ---------- ส่วนบน: ปก + ข้อมูล ---------- */
.top{padding-top:16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.main{position:relative;border-radius:12px;overflow:hidden;background:var(--fill);aspect-ratio:16/9;cursor:zoom-in;outline:1px solid rgba(17,17,20,.06);outline-offset:-1px}
.main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.main img.on{opacity:1}
.main img+img{object-fit:contain;padding:3%;background:#EEF0F4}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.thumbs button{border:none;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--fill);position:relative;outline:1px solid rgba(17,17,20,.06);outline-offset:-1px}
.thumbs button.on{outline:2px solid var(--text);outline-offset:1px}
.thumbs img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.thumbs .more{position:absolute;inset:0;background:rgba(17,17,20,.55);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.side h1{font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.side .sub{font-size:16px;color:var(--sub);margin-top:4px;text-wrap:balance}
.meta{font-size:15px;color:var(--sub);margin-top:6px}.meta b{color:var(--text);font-weight:600}
.rate{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--mid)}.rate .st{color:#F2A33A;letter-spacing:1px;font-size:14px}.rate b{color:var(--text)}
.row2{display:flex;gap:10px;align-items:center;margin-top:18px}.row2 .btn-red{flex:1;min-width:0}
.val{margin-top:18px;background:#fff;border:1px solid #E3E1DC;border-radius:12px;padding:16px 18px}
.val b{display:block;font-size:16px;font-weight:600}
.val li{list-style:none;display:flex;gap:10px;align-items:center;font-size:15px;color:var(--mid);min-height:34px}
.val li svg{width:20px;height:20px;flex:none;color:#1E7F46}
.price{display:flex;align-items:baseline;gap:10px;margin-top:16px;flex-wrap:wrap}.price b{font-size:40px;font-weight:700;line-height:1.2}.price s{color:var(--sub);font-size:18px}
.price em{font-style:normal;background:rgba(30,127,70,.12);color:#1E7F46;font-size:14px;font-weight:600;border-radius:6px;padding:2px 10px}
.bonus{margin-top:8px;display:none;align-items:center;gap:8px;font-size:14px;color:var(--mid)}.bonus.show{display:flex}.bonus svg{width:18px;height:18px;flex-shrink:0;color:var(--red)}
.bonus b{font-variant-numeric:tabular-nums;color:var(--text);background:#fff;border:1px solid #E3E1DC;border-radius:6px;padding:2px 10px}
.trust{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--sub)}.trust span{display:flex;align-items:center;gap:6px}.trust svg{width:18px;height:18px}
.chap{display:none;margin-top:36px}.chap>b{font-size:16px;font-weight:600}
.tl{margin-top:8px;border-top:1px solid var(--line)}.tl div{display:flex;gap:12px;align-items:center;min-height:48px;border-bottom:1px solid var(--line);font-size:16px}
.tl svg{width:18px;height:18px;flex:none;color:var(--red)}.tl .dim{color:var(--sub)}
/* ---------- ส่วนล่าง ---------- */
.sect{margin-top:56px}.sect h2{font-size:24px;font-weight:700;line-height:1.4}.sect .lead{font-size:16px;color:var(--sub);margin-top:2px;text-wrap:balance}
.mq{overflow:hidden;margin-top:16px}
.row{display:flex;gap:12px;width:max-content;animation:mq 80s linear infinite;margin-bottom:12px}
.row.r2{animation-direction:reverse;animation-duration:90s}
.row img{width:200px;aspect-ratio:16/9;border-radius:10px;display:block;object-fit:cover;outline:1px solid rgba(17,17,20,.06);outline-offset:-1px;background:var(--fill)}
.mq:hover .row{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.fl{display:grid;grid-template-columns:1fr;margin-top:14px;border-top:1px solid var(--line)}
.fl div{display:grid;grid-template-columns:24px 1fr;column-gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.fl svg{width:22px;height:22px;color:var(--mid);margin-top:2px}.fl b{font-size:16px;font-weight:600;line-height:1.5}.fl p{grid-column:2;font-size:15px;color:var(--sub);line-height:1.6}
.story>div+div{margin-top:48px}
.band{margin-top:56px;border-radius:16px;padding:32px 40px;color:#fff;background:var(--red);display:flex;align-items:center;justify-content:space-between;gap:24px}
.band h3{font-size:22px;font-weight:700;line-height:1.4}.band p{font-size:15px;opacity:.92;margin-top:4px}
.band .btn{background:#fff;border-color:#fff;color:var(--red);padding:0 22px}
.rel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;margin-top:16px;padding-bottom:24px}
.rel a{display:block;min-width:0}
.rel .cv{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--fill);outline:1px solid rgba(17,17,20,.06);outline-offset:-1px}
.rel img{width:100%;height:100%;display:block;object-fit:cover}
.rel b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:600;line-height:1.6;margin-top:10px}
.rel small{display:block;font-size:14px;color:var(--sub)}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease),transform .5s var(--ease)}.reveal.in{opacity:1;transform:none}
/* ---------- presenter ---------- */
.pr{position:fixed;inset:0;background:#07080c;z-index:200;display:none;flex-direction:column}
.pr.show{display:flex}
.pr .top{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;color:#cfd3e0;font-size:14px}
.pr .top button{background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer}
.pr .slide{position:relative}
.pr .wm{position:absolute;right:14px;bottom:12px;z-index:3;pointer-events:none;user-select:none;
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:700;letter-spacing:.4px;color:rgba(255,255,255,.55);
  text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pr .wm svg{width:15px;height:15px;flex:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
body.owned .pr .wm{display:none}
@media(min-width:768px){.pr .wm{right:20px;bottom:16px;font-size:14px}}
.pr .mid{flex:1;display:flex;align-items:center;justify-content:center;padding:0 70px;position:relative}
.pr .slide{position:relative;width:min(100%,calc((100vh - 170px) * 16 / 9));aspect-ratio:16/9}
.pr .slide img{position:absolute;inset:0;width:100%;height:100%;border-radius:8px;opacity:0;transform:scale(.97);transition:opacity .6s ease,transform .6s var(--ease);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pr .slide img.on{opacity:1;transform:none}
.pr .arr{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:24px;cursor:pointer}
.pr .arr.l{left:14px}.pr .arr.r{right:14px}
.pr .strip{display:flex;gap:8px;overflow-x:auto;padding:14px 22px 18px;scrollbar-width:none}.pr .strip::-webkit-scrollbar{display:none}
.pr .strip img{height:60px;aspect-ratio:16/9;border-radius:6px;opacity:.45;cursor:pointer;border:2px solid transparent;transition:opacity .2s}
.pr .strip img.on{opacity:1;border-color:#fff}
.pr .prog{height:3px;background:rgba(255,255,255,.12)}.pr .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));width:0;transition:width .4s}
.mbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  background:rgba(250,250,248,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  transform:translateY(110%);transition:transform .2s var(--ease)}
.mbar.show{transform:none}   /* โผล่เมื่อแถวปุ่มในหน้าเลื่อนพ้นจอขึ้นไปแล้ว ไม่ซ้อนปุ่มเดียวกันสองชุด */
.mbar .btn-red{flex:1}
@media(min-width:768px){
  .wrap{padding:0 40px}.top{padding-top:32px}

  .main{border-radius:16px}
  .side h1{font-size:40px}
  .chap{display:block}.story .toc{display:none}
  .sect{margin-top:88px}.sect h2{font-size:28px}
  .row img{width:300px}
  .fl2{grid-template-columns:1fr 1fr;column-gap:48px}
  .rel{grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 24px;padding-bottom:40px}
  .mbar{display:none}
}
@media(max-width:767px){.band{display:none}.pr .mid{padding:0 8px}.pr .arr{display:none}}
.lfoot{border-top:1px solid var(--line);margin-top:10px;padding:22px 20px 34px;text-align:center}
.lfoot p{font-size:13px;line-height:1.9;color:var(--sub);max-width:640px;margin:0 auto}
.lfoot p+p{margin-top:6px}
.lfoot a{color:var(--mid);text-decoration:underline;text-underline-offset:3px;margin:0 12px;font-size:14px}
.lfoot .c{font-size:13px;color:#6B6B74;margin-top:10px}
@media(max-width:767px){.lfoot{padding-bottom:110px}}
/* motion: สงบ transform/opacity เท่านั้น hover เฉพาะเครื่องที่มีเมาส์ */
.btn,.thumbs button{transition:transform .12s ease-out,background-color .12s}
.btn:active,.thumbs button:active{transform:scale(.96)}
.rel a{transition:transform .14s ease-out}.rel a:active{transform:scale(.98)}
@media(hover:hover){.btn-red:hover{background:#B5422A}.btn:not(.btn-red):hover{background:var(--fill)}.band .btn:hover{background:#fff;opacity:.92}
  .rel img{transition:opacity .2s}.rel a:hover img{opacity:.92}.rel a:hover b{color:var(--red)}}
@media(prefers-reduced-motion:reduce){.mbar{transition:none}.row{animation:none}.reveal{opacity:1;transform:none;transition:none}.btn,.thumbs button,.rel a{transition:none}.btn:active,.thumbs button:active,.rel a:active{transform:none}}
