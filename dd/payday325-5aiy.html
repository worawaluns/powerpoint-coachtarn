<title>กำลังเปิดหน้าราคาจากแชท</title>
<!-- ลิงก์ราคาจากแชท พาเข้าหน้าแรกพร้อมโค้ด เส้นทางเดียวกับลิงก์โฆษณา /dd/deck1111 ที่ลูกค้าโอนสำเร็จแล้ว
     promo.js เป็นคนตรวจโค้ดกับตาราง promo_codes แล้วทาราคาทั้งหน้า + หอบโค้ดไปหน้าสั่งซื้อ
     ref=chat ติดไปกับออเดอร์ ใช้แยกยอดแชทออกจากยอดโฆษณาในรายงาน -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  q.set('code', 'PAYDAY325-5AIY');
  if (!q.get('ref')) q.set('ref', 'chat');
  location.replace('/chat?' + q.toString());
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/chat?code=PAYDAY325-5AIY&ref=chat"></noscript>
